on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  export_game:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions: write-all
    name: Export Game
    steps:
    - name: checkout
      uses: actions/checkout@v6
    - name: export game
      id: export
      uses: firebelley/godot-export@v8.0.0
      with:
        godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
        godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
        relative_project_path: ./
        archive_output: true
    - name: Store the PR Body
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        echo "$PR_BODY" >> body.md
    - name: create release
      uses: ncipollo/release-action@v1.19.0
      with:
        token: ${{ secrets.GH_CREDENTIALS }}
        tag: ${{ github.run_number }}
        artifacts: ${{ steps.export.outputs.archive_directory }}/*
        bodyFile: "body.md"
